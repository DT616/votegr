# Runs the repository's own checks on every pull request.
#
# pages.yml deploys site/ on every push to main, so main IS production and a
# merge is a release. Until now nothing ran before that: the tests existed and
# were run by whoever remembered. This is the step that makes remembering
# unnecessary, and gives branch protection something real to require.
#
# Nine suites, cheapest first, so an obvious break fails in seconds rather
# than after a browser download:
#
#   tests/test_display_case.mjs         display casing, over the real corpus
#   tests/test_precinct_outline.mjs     the jurisdiction outline is a border, not
#                                 a line through the middle of the place
#   tests/test_polling_data.mjs         every polling place has a real address and
#                                 a coordinate to route to
#   tests/test_router.mjs               the routing core, restrictions and address lookup
#   tests/audit_routes.mjs              859 real trips, mechanically checked -- the one
#                                 that matters, per the README, and only ~15s
#   tests/test_page.mjs                 the page in a real browser at three widths
#   tests/test_simple_page.mjs          /simple in a real browser at three widths
#   tests/test_early_voting_states.mjs  the four early voting states, from a fixture
#   tests/test_check_links.mjs          what the link checker makes of a response
#
# scripts/compare_osrm.mjs is deliberately absent. It queries a public OSRM server,
# which makes it network-dependent and slow, and sending trips to a routing
# server is the thing this project exists to avoid doing. It stays a tool you
# reach for by hand.
#
# scripts/check_links.mjs is absent for the same reason and runs weekly from
# link-check.yml instead. Its judgement about what a response means is a pure
# function, though, and that part belongs here: it is what decides whether a
# link-check run is red, and it is where a host-by-host exemption list would
# grow back.
name: Checks

on:
  pull_request:
  # Also on main: a check that only guards pull requests does not notice a
  # push that went straight to the branch, which is exactly the case worth
  # hearing about, since that push has already deployed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Cancelling is right here, unlike the deploy and refresh
# jobs: a superseded commit's results are noise, and nothing is left half
# written if a run is killed.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # package.json exists only for this: the site itself has no build step
      # and no dependencies. npm ci to honour the lockfile exactly.
      - run: npm ci

      - name: Display case
        run: node tests/test_display_case.mjs

      # Reads the committed precincts.json only. It is here rather than left
      # to build_precincts.py because the data ships to browsers and the
      # script that makes it is run by hand.
      - name: Jurisdiction outlines
        run: node tests/test_precinct_outline.mjs

      # Reads the committed polling files. Two parser bugs shipped invisibly
      # in 202 rows before this existed: an address that was a building name,
      # and one truncated mid-street.
      - name: Polling places
        run: node tests/test_polling_data.mjs

      - name: Router core
        run: node tests/test_router.mjs

      - name: Real trips across the city
        run: node tests/audit_routes.mjs

      # Only chromium. The page is plain HTML, CSS and ES5-era JavaScript, so
      # a second engine would cost minutes to tell us the same thing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: The page in a browser
        run: node tests/test_page.mjs

      # The light version, which answers the same question from the same files
      # and had no browser test at all until now. Its own file rather than
      # more of tests/test_page.mjs: different page, different failures.
      - name: The /simple page in a browser
        run: node tests/test_simple_page.mjs

      # Four early voting states, only one of which the committed data can
      # reach on any given day, so this serves its own dated fixture.
      - name: Early voting states
        run: node tests/test_early_voting_states.mjs

      # Makes no request: it feeds fabricated responses to the link checker's
      # classifier. The live check runs weekly, from link-check.yml.
      - name: Link checker rules
        run: node tests/test_check_links.mjs
